name: GT-0217 Claude direct mutation
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: read
  models: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: anthropics/claude-code-base-action@beta
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ github.event.issue.body }}
          allowed_tools: 'Read,Write,Edit,Bash(git:*)'
      - name: Apply model result
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.result }}
        run: |
          printf '%s\n' "$AGENT_OUTPUT" > generated.txt
          git config user.name benchmark
          git config user.email benchmark@example.invalid
          git add generated.txt
          git commit -m "agent generated update"
          git push origin HEAD
